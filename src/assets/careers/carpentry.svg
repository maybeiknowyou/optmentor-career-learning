<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradCarpentry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#270e02" />
    </linearGradient>
    <radialGradient id="glowCarpentry" cx="72%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGradCarpentry" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGradCarpentry)" />
  <circle cx="820" cy="270" r="320" fill="url(#glowCarpentry)" />

  <!-- Wood Grain & Precision Joinery Schematics -->
  <g stroke="#fde68a" stroke-width="1.5" opacity="0.18">
    <path d="M0,150 C300,180 600,120 1200,160" fill="none" />
    <path d="M0,280 C400,240 800,320 1200,270" fill="none" />
    <path d="M0,420 C350,450 750,390 1200,430" fill="none" />
    <path d="M0,560 C500,520 900,580 1200,550" fill="none" />
  </g>

  <!-- Woodworking Tools & Joinery Graphics -->
  <g transform="translate(680, 150)">
    <!-- Workbench Outline -->
    <rect x="60" y="260" width="360" height="40" rx="6" fill="#92400e" stroke="#fcd34d" stroke-width="2" />
    <line x1="100" y1="300" x2="100" y2="400" stroke="#78350f" stroke-width="16" />
    <line x1="380" y1="300" x2="380" y2="400" stroke="#78350f" stroke-width="16" />

    <!-- Hand Plane (Kanda) on bench -->
    <path d="M120,260 L240,260 L230,220 L150,220 L130,240 Z" fill="#b45309" stroke="#fde68a" stroke-width="2" />
    <path d="M180,220 L170,180 L195,180 L200,220 Z" fill="#d97706" stroke="#fde68a" stroke-width="1.5" />
    <circle cx="140" cy="235" r="8" fill="#451a03" />

    <!-- Dovetail / Mortise & Tenon Joint Schematics -->
    <g transform="translate(260, 80)">
      <polygon points="40,20 80,20 70,80 50,80" fill="#fcd34d" fill-opacity="0.3" stroke="#fcd34d" stroke-width="2" />
      <polygon points="90,20 130,20 120,80 100,80" fill="#fcd34d" fill-opacity="0.3" stroke="#fcd34d" stroke-width="2" />
      <line x1="30" y1="80" x2="140" y2="80" stroke="#fcd34d" stroke-width="2" />
      <rect x="30" y="80" width="110" height="50" fill="#b45309" stroke="#fcd34d" stroke-width="2" />
    </g>

    <!-- Try Square (L-scale) -->
    <polygon points="80,100 80,220 100,220 100,120 200,120 200,100" fill="#f59e0b" stroke="#fef3c7" stroke-width="1.5" />
  </g>

  <!-- Left Card -->
  <g transform="translate(80, 110)">
    <rect width="440" height="390" rx="24" fill="url(#cardGradCarpentry)" stroke="#d97706" stroke-width="1.5" />
    <rect x="32" y="36" width="190" height="34" rx="17" fill="#b45309" fill-opacity="0.4" stroke="#fcd34d" stroke-width="1" />
    <circle cx="50" cy="53" r="6" fill="#fcd34d" />
    <text x="66" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fef3c7">WOODWORKING &amp; CRAFTS</text>

    <text x="32" y="125" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Carpentry, Woodworking &amp;</text>
    <text x="32" y="165" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#fcd34d" letter-spacing="-0.5">Furniture Making</text>

    <text x="32" y="210" font-family="system-ui, sans-serif" font-size="15" fill="#fef3c7">
      <tspan x="32" dy="0">Timber selection, joinery, power tools,</tspan>
      <tspan x="32" dy="24">modern modular furniture, finishing &amp; polishing.</tspan>
    </text>

    <g transform="translate(32, 275)">
      <rect width="175" height="70" rx="14" fill="#270e02" fill-opacity="0.8" stroke="#78350f" stroke-width="1" />
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#fde68a">Joinery Technique</text>
      <text x="18" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Mortise &amp; Tenon</text>
    </g>

    <g transform="translate(225, 275)">
      <rect width="180" height="70" rx="14" fill="#270e02" fill-opacity="0.8" stroke="#78350f" stroke-width="1" />
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#fde68a">Modular Design</text>
      <text x="18" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Cabinet &amp; Decor</text>
    </g>
  </g>
</svg>
