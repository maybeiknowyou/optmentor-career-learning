<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradMkt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="45%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <radialGradient id="glowMkt" cx="75%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGradMkt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGradMkt)" />
  <circle cx="820" cy="250" r="330" fill="url(#glowMkt)" />

  <!-- Analytics Grid & Funnel Outline -->
  <g stroke="#fed7aa" stroke-width="1" opacity="0.15">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Growth Charts & Funnel Graphics -->
  <g transform="translate(660, 150)">
    <!-- Analytics Chart Window -->
    <rect x="40" y="40" width="400" height="260" rx="20" fill="#18181b" fill-opacity="0.6" stroke="#fb7185" stroke-width="2" />
    <!-- Bar charts -->
    <rect x="80" y="210" width="30" height="60" rx="4" fill="url(#barGrad)" />
    <rect x="130" y="170" width="30" height="100" rx="4" fill="url(#barGrad)" />
    <rect x="180" y="140" width="30" height="130" rx="4" fill="url(#barGrad)" />
    <rect x="230" y="100" width="30" height="170" rx="4" fill="url(#barGrad)" />
    <rect x="280" y="70" width="30" height="200" rx="4" fill="url(#barGrad)" />

    <!-- Upward Trend Line with Rocket Glow -->
    <path d="M80,210 L130,170 L180,140 L230,100 L280,70 L380,45" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="380" cy="45" r="7" fill="#38bdf8" />
    <circle cx="380" cy="45" r="14" fill="#38bdf8" fill-opacity="0.3" />

    <!-- Conversion Metric Overlay -->
    <g transform="translate(180, 260)">
      <rect width="220" height="80" rx="16" fill="#09090b" fill-opacity="0.85" stroke="#fb923c" stroke-width="1.5" />
      <text x="20" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#fda4af">ROAS Campaign Target</text>
      <text x="20" y="58" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">+340% Growth</text>
    </g>
  </g>

  <!-- Left Card -->
  <g transform="translate(80, 110)">
    <rect width="440" height="390" rx="24" fill="url(#cardGradMkt)" stroke="#fb7185" stroke-width="1.5" />
    <rect x="32" y="36" width="190" height="34" rx="17" fill="#e11d48" fill-opacity="0.3" stroke="#fb7185" stroke-width="1" />
    <circle cx="50" cy="53" r="6" fill="#fb7185" />
    <text x="66" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fecdd3">GROWTH &amp; BUSINESS</text>

    <text x="32" y="125" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Digital Marketing &amp;</text>
    <text x="32" y="165" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#fb923c" letter-spacing="-0.5">Entrepreneurship</text>

    <text x="32" y="210" font-family="system-ui, sans-serif" font-size="15" fill="#ffe4e6">
      <tspan x="32" dy="0">SEO, social media growth, ad campaigns,</tspan>
      <tspan x="32" dy="24">e-commerce storefronts &amp; startup execution.</tspan>
    </text>

    <g transform="translate(32, 275)">
      <rect width="175" height="70" rx="14" fill="#18181b" fill-opacity="0.7" stroke="#e11d48" stroke-width="1" />
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#fda4af">Channel Mastery</text>
      <text x="18" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">SEO &amp; Performance</text>
    </g>

    <g transform="translate(225, 275)">
      <rect width="180" height="70" rx="14" fill="#18181b" fill-opacity="0.7" stroke="#e11d48" stroke-width="1" />
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#fda4af">Venture Building</text>
      <text x="18" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">E-Commerce &amp; D2C</text>
    </g>
  </g>
</svg>
