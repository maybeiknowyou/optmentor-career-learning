<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradAIML" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="glowAIML" cx="75%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGradAIML" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGradAIML)" />
  <circle cx="820" cy="270" r="320" fill="url(#glowAIML)" />

  <!-- Neural Network Mesh / Synaptic Graph -->
  <g stroke="#818cf8" stroke-width="1.5" opacity="0.4">
    <!-- Input layer to Hidden 1 -->
    <line x1="720" y1="180" x2="820" y2="140" />
    <line x1="720" y1="180" x2="820" y2="230" />
    <line x1="720" y1="180" x2="820" y2="320" />
    <line x1="720" y1="270" x2="820" y2="140" />
    <line x1="720" y1="270" x2="820" y2="230" />
    <line x1="720" y1="270" x2="820" y2="320" />
    <line x1="720" y1="360" x2="820" y2="230" />
    <line x1="720" y1="360" x2="820" y2="320" />
    <line x1="720" y1="360" x2="820" y2="410" />

    <!-- Hidden 1 to Hidden 2 -->
    <line x1="820" y1="140" x2="940" y2="180" />
    <line x1="820" y1="140" x2="940" y2="280" />
    <line x1="820" y1="230" x2="940" y2="180" />
    <line x1="820" y1="230" x2="940" y2="280" />
    <line x1="820" y1="320" x2="940" y2="280" />
    <line x1="820" y1="320" x2="940" y2="380" />
    <line x1="820" y1="410" x2="940" y2="380" />

    <!-- Hidden 2 to Output -->
    <line x1="940" y1="180" x2="1050" y2="230" />
    <line x1="940" y1="280" x2="1050" y2="230" />
    <line x1="940" y1="280" x2="1050" y2="330" />
    <line x1="940" y1="380" x2="1050" y2="330" />
  </g>

  <!-- Node Circles -->
  <!-- Layer 1 -->
  <circle cx="720" cy="180" r="12" fill="#38bdf8" />
  <circle cx="720" cy="270" r="12" fill="#38bdf8" />
  <circle cx="720" cy="360" r="12" fill="#38bdf8" />
  <!-- Layer 2 -->
  <circle cx="820" cy="140" r="14" fill="#a855f7" />
  <circle cx="820" cy="230" r="14" fill="#a855f7" />
  <circle cx="820" cy="320" r="14" fill="#a855f7" />
  <circle cx="820" cy="410" r="14" fill="#a855f7" />
  <!-- Layer 3 -->
  <circle cx="940" cy="180" r="14" fill="#6366f1" />
  <circle cx="940" cy="280" r="14" fill="#6366f1" />
  <circle cx="940" cy="380" r="14" fill="#6366f1" />
  <!-- Output -->
  <circle cx="1050" cy="230" r="16" fill="#22d3ee" stroke="#ffffff" stroke-width="2" />
  <circle cx="1050" cy="330" r="16" fill="#22d3ee" stroke="#ffffff" stroke-width="2" />

  <!-- Left Card -->
  <g transform="translate(80, 110)">
    <rect width="440" height="390" rx="24" fill="url(#cardGradAIML)" stroke="#818cf8" stroke-width="1.5" />
    <rect x="32" y="36" width="190" height="34" rx="17" fill="#4338ca" fill-opacity="0.4" stroke="#818cf8" stroke-width="1" />
    <circle cx="50" cy="53" r="6" fill="#38bdf8" />
    <text x="66" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e0e7ff">ARTIFICIAL INTELLIGENCE</text>

    <text x="32" y="125" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Artificial Intelligence &amp;</text>
    <text x="32" y="165" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#38bdf8" letter-spacing="-0.5">Machine Learning</text>

    <text x="32" y="210" font-family="system-ui, sans-serif" font-size="15" fill="#e2e8f0">
      <tspan x="32" dy="0">Neural networks, deep learning, computer</tspan>
      <tspan x="32" dy="24">vision, NLP models, PyTorch &amp; responsible AI.</tspan>
    </text>

    <g transform="translate(32, 275)">
      <rect width="175" height="70" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#3730a3" stroke-width="1" />
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#a5b4fc">Frameworks</text>
      <text x="18" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">PyTorch / Scikit</text>
    </g>

    <g transform="translate(225, 275)">
      <rect width="180" height="70" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#3730a3" stroke-width="1" />
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#a5b4fc">Model Pipeline</text>
      <text x="18" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Training &amp; Eval</text>
    </g>
  </g>
</svg>
