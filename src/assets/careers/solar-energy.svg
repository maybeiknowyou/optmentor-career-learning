<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradSolar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#ca8a04" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGradSolar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGradSolar)" />
  <circle cx="850" cy="200" r="300" fill="url(#sunGlow)" />

  <!-- Sun Rays & Energy Lines -->
  <g stroke="#fef08a" stroke-width="2" opacity="0.3">
    <line x1="850" y1="200" x2="650" y2="350" />
    <line x1="850" y1="200" x2="750" y2="380" />
    <line x1="850" y1="200" x2="850" y2="400" />
    <line x1="850" y1="200" x2="950" y2="380" />
    <line x1="850" y1="200" x2="1050" y2="350" />
  </g>

  <!-- Photovoltaic Solar Panels Array -->
  <g transform="translate(640, 260)">
    <!-- Panel 1 (left) -->
    <polygon points="40,160 160,160 120,60 20,60" fill="#0284c7" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2" />
    <line x1="80" y1="60" x2="100" y2="160" stroke="#bae6fd" stroke-width="1.5" />
    <line x1="30" y1="110" x2="140" y2="110" stroke="#bae6fd" stroke-width="1.5" />

    <!-- Panel 2 (center) -->
    <polygon points="180,160 300,160 260,60 160,60" fill="#0284c7" fill-opacity="0.85" stroke="#38bdf8" stroke-width="2" />
    <line x1="210" y1="60" x2="240" y2="160" stroke="#bae6fd" stroke-width="1.5" />
    <line x1="170" y1="110" x2="280" y2="110" stroke="#bae6fd" stroke-width="1.5" />

    <!-- Panel 3 (right) -->
    <polygon points="320,160 440,160 400,60 300,60" fill="#0284c7" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2" />
    <line x1="350" y1="60" x2="380" y2="160" stroke="#bae6fd" stroke-width="1.5" />
    <line x1="310" y1="110" x2="420" y2="110" stroke="#bae6fd" stroke-width="1.5" />

    <!-- Panel Mounting Frames -->
    <line x1="30" y1="160" x2="30" y2="230" stroke="#94a3b8" stroke-width="4" />
    <line x1="150" y1="160" x2="150" y2="230" stroke="#94a3b8" stroke-width="4" />
    <line x1="290" y1="160" x2="290" y2="230" stroke="#94a3b8" stroke-width="4" />
    <line x1="430" y1="160" x2="430" y2="230" stroke="#94a3b8" stroke-width="4" />

    <!-- Solar Inverter / Storage Unit -->
    <g transform="translate(360, 200)">
      <rect width="90" height="130" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
      <rect x="15" y="20" width="60" height="30" rx="4" fill="#0284c7" />
      <text x="25" y="40" font-family="monospace" font-size="12" fill="#67e8f9">4.8 kW</text>
      <circle cx="30" cy="70" r="5" fill="#22c55e" />
      <circle cx="50" cy="70" r="5" fill="#eab308" />
      <circle cx="70" cy="70" r="5" fill="#3b82f6" />
    </g>
  </g>

  <!-- Left Card -->
  <g transform="translate(80, 110)">
    <rect width="440" height="390" rx="24" fill="url(#cardGradSolar)" stroke="#2dd4bf" stroke-width="1.5" />
    <rect x="32" y="36" width="180" height="34" rx="17" fill="#0f766e" fill-opacity="0.5" stroke="#2dd4bf" stroke-width="1" />
    <circle cx="50" cy="53" r="6" fill="#facc15" />
    <text x="66" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ccfbf1">RENEWABLE ENERGY</text>

    <text x="32" y="125" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Solar Energy &amp;</text>
    <text x="32" y="165" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#fde047" letter-spacing="-0.5">Green Jobs</text>

    <text x="32" y="210" font-family="system-ui, sans-serif" font-size="15" fill="#e6fffa">
      <tspan x="32" dy="0">Rooftop solar PV installation, inverter</tspan>
      <tspan x="32" dy="24">diagnostics, grid tie-in, Suryamitra &amp; green skills.</tspan>
    </text>

    <g transform="translate(32, 275)">
      <rect width="175" height="70" rx="14" fill="#134e4a" fill-opacity="0.7" stroke="#0d9488" stroke-width="1" />
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#5eead4">Certification</text>
      <text x="18" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Suryamitra PV</text>
    </g>

    <g transform="translate(225, 275)">
      <rect width="180" height="70" rx="14" fill="#134e4a" fill-opacity="0.7" stroke="#0d9488" stroke-width="1" />
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#5eead4">Installation</text>
      <text x="18" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">On-Grid &amp; Hybrid</text>
    </g>
  </g>
</svg>
