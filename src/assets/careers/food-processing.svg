<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradFood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="50%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <radialGradient id="glowFood" cx="70%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGradFood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGradFood)" />
  <circle cx="820" cy="240" r="320" fill="url(#glowFood)" />

  <!-- Industrial Facility Lines -->
  <g stroke="#fed7aa" stroke-width="1" opacity="0.12">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Processing Equipment Illustration -->
  <g transform="translate(680, 150)">
    <!-- Stainless Steel Tank / Pasteurizer -->
    <rect x="80" y="80" width="160" height="260" rx="30" fill="#fed7aa" fill-opacity="0.15" stroke="#fb923c" stroke-width="2.5" />
    <!-- Pressure gauge -->
    <circle cx="160" cy="150" r="28" fill="#431407" stroke="#fdba74" stroke-width="2" />
    <line x1="160" y1="150" x2="175" y2="140" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
    <circle cx="160" cy="150" r="4" fill="#fb923c" />
    <!-- Pipe connections -->
    <path d="M240,160 L320,160 L320,290 L400,290" fill="none" stroke="#fdba74" stroke-width="6" stroke-linecap="round" />
    <path d="M40,240 L80,240" fill="none" stroke="#fdba74" stroke-width="6" stroke-linecap="round" />
    <!-- Bottling / Packaging Line -->
    <rect x="290" y="310" width="160" height="30" rx="6" fill="#7c2d12" stroke="#fb923c" stroke-width="2" />
    <rect x="310" y="270" width="22" height="40" rx="4" fill="#fed7aa" fill-opacity="0.8" />
    <rect x="350" y="270" width="22" height="40" rx="4" fill="#fed7aa" fill-opacity="0.8" />
    <rect x="390" y="270" width="22" height="40" rx="4" fill="#fed7aa" fill-opacity="0.8" />
    <!-- Sterilization / Quality seal -->
    <polygon points="160,370 175,410 220,410 185,435 200,475 160,450 120,475 135,435 100,410 145,410" fill="#f59e0b" opacity="0.8" />
  </g>

  <!-- Left Glassmorphic UI card -->
  <g transform="translate(80, 110)">
    <rect width="440" height="390" rx="24" fill="url(#cardGradFood)" stroke="#fb923c" stroke-width="1.5" />
    <rect x="32" y="36" width="180" height="34" rx="17" fill="#ea580c" fill-opacity="0.3" stroke="#fb923c" stroke-width="1" />
    <circle cx="50" cy="53" r="6" fill="#fb923c" />
    <text x="66" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fed7aa">FOOD TECHNOLOGY</text>

    <text x="32" y="125" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Food Processing &amp;</text>
    <text x="32" y="165" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#fdba74" letter-spacing="-0.5">Preservation</text>

    <text x="32" y="210" font-family="system-ui, sans-serif" font-size="15" fill="#ffedd5">
      <tspan x="32" dy="0">Post-harvest storage, canning, hygiene,</tspan>
      <tspan x="32" dy="24">cold chain management &amp; FSSAI standards.</tspan>
    </text>

    <g transform="translate(32, 275)">
      <rect width="175" height="70" rx="14" fill="#431407" fill-opacity="0.7" stroke="#c2410c" stroke-width="1" />
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#fdba74">Safety Protocol</text>
      <text x="18" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">HACCP / FSSAI</text>
    </g>

    <g transform="translate(225, 275)">
      <rect width="180" height="70" rx="14" fill="#431407" fill-opacity="0.7" stroke="#c2410c" stroke-width="1" />
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#fdba74">Cold Storage</text>
      <text x="18" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">-18°C Verified</text>
    </g>
  </g>
</svg>
