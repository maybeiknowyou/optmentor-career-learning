<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradHealth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>
    <radialGradient id="glowHealth" cx="75%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGradHealth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGradHealth)" />
  <circle cx="820" cy="250" r="330" fill="url(#glowHealth)" />

  <!-- ECG / Vital Rhythm Wave across backdrop -->
  <path d="M0,340 L580,340 L600,310 L620,380 L640,260 L660,390 L680,330 L700,340 L1200,340" fill="none" stroke="#67e8f9" stroke-width="3" opacity="0.4" />

  <!-- Healthcare Elements Illustration -->
  <g transform="translate(680, 140)">
    <!-- Hospital / Medical Cross Badge -->
    <g transform="translate(180, 60)">
      <circle cx="60" cy="60" r="55" fill="#ffffff" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2.5" />
      <rect x="48" y="25" width="24" height="70" rx="6" fill="#ef4444" />
      <rect x="25" y="48" width="70" height="24" rx="6" fill="#ef4444" />
    </g>

    <!-- Stethoscope Graphic -->
    <g transform="translate(100, 180)">
      <path d="M60,60 C60,160 200,160 200,60" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
      <path d="M130,160 C130,220 180,240 220,240" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
      <circle cx="230" cy="240" r="18" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
      <circle cx="60" cy="50" r="6" fill="#94a3b8" />
      <circle cx="200" cy="50" r="6" fill="#94a3b8" />
    </g>

    <!-- Tablet / Patient Vitals Monitor -->
    <g transform="translate(260, 220)">
      <rect width="130" height="150" rx="14" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2" />
      <rect x="15" y="15" width="100" height="40" rx="6" fill="#082f49" />
      <text x="25" y="40" font-family="monospace" font-size="14" fill="#4ade80">SpO2: 99%</text>
      <text x="25" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#bae6fd">BP: 120/80</text>
      <text x="25" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#bae6fd">Pulse: 72 bpm</text>
    </g>
  </g>

  <!-- Left Card -->
  <g transform="translate(80, 110)">
    <rect width="440" height="390" rx="24" fill="url(#cardGradHealth)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="32" y="36" width="190" height="34" rx="17" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <circle cx="50" cy="53" r="6" fill="#38bdf8" />
    <text x="66" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e0f2fe">HEALTHCARE &amp; NURSING</text>

    <text x="32" y="125" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Healthcare Assistance &amp;</text>
    <text x="32" y="165" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#38bdf8" letter-spacing="-0.5">Community Health</text>

    <text x="32" y="210" font-family="system-ui, sans-serif" font-size="15" fill="#f0fdfa">
      <tspan x="32" dy="0">Patient care assistance, vital monitoring,</tspan>
      <tspan x="32" dy="24">first aid, hygiene protocols &amp; community wellness.</tspan>
    </text>

    <g transform="translate(32, 275)">
      <rect width="175" height="70" rx="14" fill="#083344" fill-opacity="0.7" stroke="#0e7490" stroke-width="1" />
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#67e8f9">Care Discipline</text>
      <text x="18" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">General Duty Aide</text>
    </g>

    <g transform="translate(225, 275)">
      <rect width="180" height="70" rx="14" fill="#083344" fill-opacity="0.7" stroke="#0e7490" stroke-width="1" />
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#67e8f9">Emergency Skill</text>
      <text x="18" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">First Aid &amp; CPR</text>
    </g>
  </g>
</svg>
