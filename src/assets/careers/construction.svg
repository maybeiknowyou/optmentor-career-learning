<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradConst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glowConst" cx="72%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGradConst" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGradConst)" />
  <circle cx="820" cy="250" r="320" fill="url(#glowConst)" />

  <!-- Construction Scaffolding & Beams -->
  <g stroke="#f97316" stroke-width="2" opacity="0.25">
    <line x1="680" y1="480" x2="1150" y2="480" />
    <line x1="680" y1="360" x2="1150" y2="360" />
    <line x1="680" y1="240" x2="1150" y2="240" />
    <line x1="720" y1="120" x2="720" y2="580" />
    <line x1="860" y1="120" x2="860" y2="580" />
    <line x1="1000" y1="120" x2="1000" y2="580" />
    <line x1="1120" y1="120" x2="1120" y2="580" />
    <!-- Diagonal Cross Bracing -->
    <line x1="720" y1="360" x2="860" y2="480" />
    <line x1="860" y1="360" x2="720" y2="480" />
    <line x1="860" y1="360" x2="1000" y2="480" />
    <line x1="1000" y1="360" x2="860" y2="480" />
    <line x1="720" y1="240" x2="860" y2="360" />
    <line x1="860" y1="240" x2="720" y2="360" />
  </g>

  <!-- Tower Crane & Hardhat Illustration -->
  <g transform="translate(700, 100)">
    <!-- Tower Crane Mast -->
    <rect x="260" y="40" width="16" height="380" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
    <line x1="100" y1="40" x2="380" y2="40" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <!-- Crane tie-wires -->
    <line x1="268" y1="10" x2="160" y2="40" stroke="#fbbf24" stroke-width="2" />
    <line x1="268" y1="10" x2="360" y2="40" stroke="#fbbf24" stroke-width="2" />
    <polygon points="268,10 262,40 274,40" fill="#f59e0b" />
    <!-- Cable and Hook -->
    <line x1="180" y1="40" x2="180" y2="180" stroke="#e2e8f0" stroke-width="2" />
    <path d="M174,180 C174,195 186,195 186,185" fill="none" stroke="#f59e0b" stroke-width="3" />

    <!-- Hardhat Motif -->
    <g transform="translate(60, 280)">
      <ellipse cx="60" cy="50" rx="46" ry="16" fill="#f59e0b" />
      <path d="M20,50 C20,18 100,18 100,50 Z" fill="#fbbf24" />
      <rect x="52" y="22" width="16" height="28" rx="2" fill="#d97706" />
    </g>
  </g>

  <!-- Left Card -->
  <g transform="translate(80, 110)">
    <rect width="440" height="390" rx="24" fill="url(#cardGradConst)" stroke="#fb923c" stroke-width="1.5" />
    <rect x="32" y="36" width="190" height="34" rx="17" fill="#c2410c" fill-opacity="0.3" stroke="#fb923c" stroke-width="1" />
    <circle cx="50" cy="53" r="6" fill="#fb923c" />
    <text x="66" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fed7aa">INFRASTRUCTURE &amp; TRADES</text>

    <text x="32" y="125" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Construction &amp;</text>
    <text x="32" y="165" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#fb923c" letter-spacing="-0.5">Skilled Trades</text>

    <text x="32" y="210" font-family="system-ui, sans-serif" font-size="15" fill="#f1f5f9">
      <tspan x="32" dy="0">Civil surveying, blueprint reading, masonry,</tspan>
      <tspan x="32" dy="24">bar bending, safety compliance &amp; site works.</tspan>
    </text>

    <g transform="translate(32, 275)">
      <rect width="175" height="70" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#fb923c">Site Safety</text>
      <text x="18" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">OSHA / IS Codes</text>
    </g>

    <g transform="translate(225, 275)">
      <rect width="180" height="70" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#fb923c">Trade Skill</text>
      <text x="18" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Survey &amp; Masonry</text>
    </g>
  </g>
</svg>
